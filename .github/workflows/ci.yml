name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ConnectionStrings__Default: Host=localhost;Port=5432;Database=sonivo_dev;Username=sonivo;Password=sonivo
  SONIVO_TEST_PG: Host=localhost;Port=5432;Database=sonivo_dev;Username=sonivo;Password=sonivo
  ASPNETCORE_ENVIRONMENT: Development

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: sonivo_dev
          POSTGRES_USER: sonivo
          POSTGRES_PASSWORD: sonivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonivo -d sonivo_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 9.0.9
      - name: Restore
        run: dotnet restore Sonivo.slnx
      - name: Build
        run: dotnet build Sonivo.slnx --no-restore --configuration Release
      - name: Apply EF migrations
        run: >
          dotnet ef database update
          --project src/Sonivo.Infrastructure
          --startup-project src/Sonivo.Api
      - name: Test
        run: dotnet test Sonivo.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/sonivo-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/sonivo-web/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: sonivo_dev
          POSTGRES_USER: sonivo
          POSTGRES_PASSWORD: sonivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonivo -d sonivo_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/sonivo-web/package-lock.json
            e2e/package-lock.json
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 9.0.9
      - name: Restore & migrate
        run: |
          dotnet restore Sonivo.slnx
          dotnet ef database update --project src/Sonivo.Infrastructure --startup-project src/Sonivo.Api
      - name: Install frontend deps
        working-directory: web/sonivo-web
        run: npm ci
      - name: Install E2E deps
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps
      - name: Start API
        run: |
          nohup dotnet run --project src/Sonivo.Api --no-launch-profile --urls http://127.0.0.1:5171 > /tmp/sonivo-api.log 2>&1 &
          echo $! > /tmp/sonivo-api.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5171/api/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"; cat /tmp/sonivo-api.log; exit 1
      - name: Start frontend
        working-directory: web/sonivo-web
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/sonivo-web.log 2>&1 &
          echo $! > /tmp/sonivo-web.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ >/dev/null; then
              echo "Frontend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start"; cat /tmp/sonivo-web.log; exit 1
      - name: Run Playwright
        working-directory: e2e
        env:
          CI: true
          SONIVO_E2E_BASE_URL: http://127.0.0.1:5173
        run: npm test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
