name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; only the E2E job needs Actions writes for failure artifacts.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ConnectionStrings__Default: Host=localhost;Port=5432;Database=sonivo_dev;Username=sonivo_app;Password=sonivo-app-dev-only
  ASPNETCORE_ENVIRONMENT: Development

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: sonivo_dev
          POSTGRES_USER: sonivo
          POSTGRES_PASSWORD: sonivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonivo -d sonivo_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Provision constrained application role
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=sonivo \
            -v "$PWD/scripts/db:/scripts:ro" \
            postgres:16.6 psql -h 127.0.0.1 -U sonivo -d sonivo_dev \
              -v ON_ERROR_STOP=1 -f /scripts/bootstrap-rls-roles.sql
      - name: Restore
        run: dotnet restore Sonivo.slnx
      - name: Build
        run: dotnet build Sonivo.slnx --no-restore --configuration Release
      - name: Apply EF migrations
        env:
          SONIVO_MIGRATION_CONNECTION: Host=localhost;Port=5432;Database=sonivo_dev;Username=sonivo;Password=sonivo
        run: >
          dotnet ef database update
          --project src/Sonivo.Infrastructure
          --startup-project src/Sonivo.Api
      - name: Apply reviewed runtime table privileges
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=sonivo \
            -v "$PWD/scripts/db:/scripts:ro" \
            postgres:16.6 psql -h 127.0.0.1 -U sonivo -d sonivo_dev \
              -v ON_ERROR_STOP=1 -f /scripts/grant-runtime-privileges.sql
      - name: Verify constrained runtime principal
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=sonivo-app-dev-only \
            -v "$PWD/scripts/db:/scripts:ro" \
            postgres:16.6 psql -h 127.0.0.1 -U sonivo_app -d sonivo_dev \
              -v ON_ERROR_STOP=1 -f /scripts/verify-runtime-principal.sql
      - name: Test
        env:
          SONIVO_TEST_PG: Host=localhost;Port=5432;Database=sonivo_dev;Username=sonivo;Password=sonivo
          SONIVO_RLS_TEST_PG: Host=localhost;Port=5432;Database=sonivo_dev;Username=sonivo_app;Password=sonivo-app-dev-only
        run: dotnet test Sonivo.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      actions: write
      contents: read
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: sonivo_dev
          POSTGRES_USER: sonivo
          POSTGRES_PASSWORD: sonivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonivo -d sonivo_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Provision constrained application role
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=sonivo \
            -v "$PWD/scripts/db:/scripts:ro" \
            postgres:16.6 psql -h 127.0.0.1 -U sonivo -d sonivo_dev \
              -v ON_ERROR_STOP=1 -f /scripts/bootstrap-rls-roles.sql
      - name: Restore & migrate
        env:
          SONIVO_MIGRATION_CONNECTION: Host=localhost;Port=5432;Database=sonivo_dev;Username=sonivo;Password=sonivo
        run: |
          dotnet restore Sonivo.slnx
          dotnet ef database update --project src/Sonivo.Infrastructure --startup-project src/Sonivo.Api
      - name: Apply reviewed runtime table privileges
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=sonivo \
            -v "$PWD/scripts/db:/scripts:ro" \
            postgres:16.6 psql -h 127.0.0.1 -U sonivo -d sonivo_dev \
              -v ON_ERROR_STOP=1 -f /scripts/grant-runtime-privileges.sql
      - name: Verify constrained runtime principal
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=sonivo-app-dev-only \
            -v "$PWD/scripts/db:/scripts:ro" \
            postgres:16.6 psql -h 127.0.0.1 -U sonivo_app -d sonivo_dev \
              -v ON_ERROR_STOP=1 -f /scripts/verify-runtime-principal.sql
      - name: Install frontend deps
        working-directory: web
        run: npm ci
      - name: Install E2E deps
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps
      - name: Build static-export routing smoke target
        working-directory: web
        env:
          NEXT_EXPORT: "1"
        run: npm run build --workspace=@sonivo/app
      - name: Verify static-host app and Group routes
        working-directory: e2e
        env:
          SONIVO_E2E_STATIC_EXPORT: "1"
          SONIVO_E2E_PORT: "5174"
          SONIVO_E2E_BASE_URL: http://127.0.0.1:5174
        run: npx playwright test tests/static-export-routing.spec.ts
      - name: Start API
        env:
          # T-AU-01: E2E-only mailbox bypass (POST /api/auth/test/confirm).
          # Never set in prod; the endpoint 404s when the flag is absent.
          Auth__EnableTestHook: "true"
        run: |
          nohup dotnet run --project src/Sonivo.Api --no-launch-profile --urls http://127.0.0.1:5171 > /tmp/sonivo-api.log 2>&1 &
          echo $! > /tmp/sonivo-api.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5171/api/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"; cat /tmp/sonivo-api.log; exit 1
      - name: Start frontend
        working-directory: web
        run: |
          nohup npm run dev --workspace @sonivo/app > /tmp/sonivo-web.log 2>&1 &
          echo $! > /tmp/sonivo-web.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ >/dev/null; then
              echo "Frontend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start"; cat /tmp/sonivo-web.log; exit 1
      - name: Run Playwright
        working-directory: e2e
        env:
          CI: true
          # WebAuthn fix: headless Chromium rejects navigator.credentials.* on
          # IP-literal origins (SecurityError "invalid domain"), so the passkey
          # journey must browse via localhost (Chromium treats it as a
          # potentially trustworthy origin).
          SONIVO_E2E_BASE_URL: http://localhost:5173
        run: npm test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
