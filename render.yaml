# Render Blueprint (free web). Create the Neon DB first, then paste ConnectionStrings__Default
# in the Render dashboard (sync: false below). Do not put secrets in this file.

services:
  - type: web
    name: sonivo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: SONIVO_MIGRATE_ON_START
        value: "true"
      - key: ConnectionStrings__Default
        sync: false
      - key: PublicOrigin
        value: https://sonivo.onrender.com
      - key: Gmail__ClientId
        sync: false
      - key: Gmail__ClientSecret
        sync: false
      - key: Gmail__RefreshToken
        sync: false
      - key: Gmail__From
        sync: false
      # User Google sign-in (ADR-0026) — separate OAuth client from Gmail send
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false
      # Cloudflare R2 blob backend (ADR-0035) — scoped bucket token, per-env
      - key: R2__AccountId
        sync: false
      - key: R2__AccessKey
        sync: false
      - key: R2__Secret
        sync: false
      - key: R2__BucketName
        sync: false
